<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leena Sajja — Energy Flow | Professional Yoga Trainer</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['Syne', 'sans-serif'],
          },
          colors: {
            lightBg: '#F8F6F0',
            lightCream: '#EFE9DD',
            lightSage: '#718064',
            lightTerracotta: '#C97960',
            lightGold: '#D0A75A',
            lightCharcoal: '#242521',
            
            darkBg: '#080909',
            darkCharcoal: '#111313',
            darkForest: '#304133',
            darkSage: '#829274',
            darkCoral: '#D97860',
            darkGold: '#D1AA63',
            darkWhite: '#F4F1E9',
          },
          animation: {
            'spin-slow': 'spin 25s linear infinite',
            'spin-reverse-slow': 'spin-reverse 35s linear infinite',
            'float': 'float 6s ease-in-out infinite',
            'pulse-glow': 'pulseGlow 3s ease-in-out infinite',
          },
          keyframes: {
            'spin-reverse': {
              '0%': { transform: 'rotate(0deg)' },
              '100%': { transform: 'rotate(-360deg)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-12px)' },
            },
            pulseGlow: {
              '0%, 100%': { opacity: '0.4', transform: 'scale(1)' },
              '50%': { opacity: '0.8', transform: 'scale(1.05)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    :root[data-theme="light"] {
      --bg-main: #F8F6F0;
      --bg-surface: #EFE9DD;
      --accent-sage: #718064;
      --accent-primary: #C97960;
      --accent-gold: #D0A75A;
      --text-main: #242521;
      --text-muted: #5C5E57;
      --border-color: rgba(36, 37, 33, 0.12);
      --orb-glow: rgba(208, 167, 90, 0.35);
      --glass-bg: rgba(248, 246, 240, 0.75);
      --card-bg: rgba(239, 233, 221, 0.6);
    }

    :root[data-theme="dark"] {
      --bg-main: #080909;
      --bg-surface: #111313;
      --accent-sage: #829274;
      --accent-primary: #D97860;
      --accent-gold: #D1AA63;
      --text-main: #F4F1E9;
      --text-muted: #A3A89E;
      --border-color: rgba(244, 241, 233, 0.12);
      --orb-glow: rgba(209, 170, 99, 0.25);
      --glass-bg: rgba(8, 9, 9, 0.75);
      --card-bg: rgba(17, 19, 19, 0.6);
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      transition: background-color 0.8s cubic-bezier(0.16, 1, 0.3, 1), color 0.8s ease;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    /* Universal smooth color & background transitions for seamless mode morphing */
*,
*::before,
*::after {
  transition:
    background-color 0.7s cubic-bezier(0.16, 1, 0.3, 1),
    border-color 0.7s cubic-bezier(0.16, 1, 0.3, 1),
    color 0.7s cubic-bezier(0.16, 1, 0.3, 1),
    box-shadow 0.7s cubic-bezier(0.16, 1, 0.3, 1);
}

    /* Refined Architectural Arch Frame Styles */
    .mask-arch-shape {
      border-radius: 14rem 14rem 2.5rem 2.5rem;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .mask-arch-reverse {
      border-radius: 2.5rem 2.5rem 14rem 14rem;
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-main);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--accent-sage);
      border-radius: 4px;
    }

    /* Smooth transition overlay */
    .theme-transition-orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      box-shadow: 0 0 100px rgba(208, 167, 90, 0.4);
      transition: transform 5.85s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease-out;
      will-change: transform, opacity;
    }

    /* Toggle button spin/pulse keyframe animation */
    @keyframes coreToggleSpin {
      0% { transform: rotate(0deg) scale(0.85); }
      50% { transform: rotate(180deg) scale(1.3); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .theme-toggle-active {
      animation: coreToggleSpin 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Radial glow */
    .energy-glow {
      box-shadow: 0 0 60px var(--orb-glow), inset 0 0 30px var(--orb-glow);
    }

    @media (hover: hover) and (pointer: fine) {
      body {
        cursor: default;
      }
    }
    .custom-cursor-dot {
      position: fixed;
      top: 0;
      left: 0;
      width: 8px;
      height: 8px;
      background-color: var(--accent-gold);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      transition: width 0.25s ease, height 0.25s ease, background-color 0.3s ease, transform 0.15s ease-out;
      will-change: transform;
    }
    .custom-cursor-ring {
      position: fixed;
      top: 0;
      left: 0;
      width: 38px;
      height: 38px;
      border: 1.5px solid var(--accent-gold);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99998;
      transform: translate(-50%, -50%);
      transition: width 0.3s ease, height 0.3s ease, border-color 0.3s ease, background-color 0.3s ease, transform 0.2s ease-out;
      will-change: transform;
    }
    .custom-cursor-trail {
      position: fixed;
      top: 0;
      left: 0;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--orb-glow) 0%, transparent 70%);
      pointer-events: none;
      z-index: 99997;
      transform: translate(-50%, -50%);
      will-change: transform;
      opacity: 0.7;
      transition: transform 0.3s ease-out, opacity 0.3s ease;
    }
  </style>
</head>
<body class="font-sans antialiased selection:bg-amber-500/30">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function CustomCursor() {
      const [position, setPosition] = useState({ x: -100, y: -100 });
      const [ringPos, setRingPos] = useState({ x: -100, y: -100 });
      const [trailPos, setTrailPos] = useState({ x: -100, y: -100 });
      const [isHovered, setIsHovered] = useState(false);
      const [isClicking, setIsClicking] = useState(false);
      const [isVisible, setIsVisible] = useState(false);

      const posRef = useRef({ x: -100, y: -100 });
      const ringRef = useRef({ x: -100, y: -100 });
      const trailRef = useRef({ x: -100, y: -100 });
      const requestRef = useRef();

      useEffect(() => {
        const handleMouseMove = (e) => {
          posRef.current = { x: e.clientX, y: e.clientY };
          setPosition({ x: e.clientX, y: e.clientY });
          if (!isVisible) setIsVisible(true);

          // Detect interactive elements
          const target = e.target;
          const isInteractive = target && target.closest('button, a, input, textarea, select, [role="button"], .cursor-pointer');
          setIsHovered(!!isInteractive);
        };

        const handleMouseDown = () => setIsClicking(true);
        const handleMouseUp = () => setIsClicking(false);
        const handleMouseLeave = () => setIsVisible(false);
        const handleMouseEnter = () => setIsVisible(true);

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mousedown', handleMouseDown);
        window.addEventListener('mouseup', handleMouseUp);
        document.addEventListener('mouseleave', handleMouseLeave);
        document.addEventListener('mouseenter', handleMouseEnter);

        // Smooth physics loop (lerp)
        const animateCursor = () => {
          ringRef.current.x += (posRef.current.x - ringRef.current.x) * 0.22;
          ringRef.current.y += (posRef.current.y - ringRef.current.y) * 0.22;
          setRingPos({ x: ringRef.current.x, y: ringRef.current.y });

          trailRef.current.x += (posRef.current.x - trailRef.current.x) * 0.08;
          trailRef.current.y += (posRef.current.y - trailRef.current.y) * 0.08;
          setTrailPos({ x: trailRef.current.x, y: trailRef.current.y });

          requestRef.current = requestAnimationFrame(animateCursor);
        };

        requestRef.current = requestAnimationFrame(animateCursor);

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mousedown', handleMouseDown);
          window.removeEventListener('mouseup', handleMouseUp);
          document.removeEventListener('mouseleave', handleMouseLeave);
          document.removeEventListener('mouseenter', handleMouseEnter);
          cancelAnimationFrame(requestRef.current);
        };
      }, [isVisible]);

      if (!isVisible) return null;

      return (
        <React.Fragment>
          {/* Ambient Glowing Trail */}
          <div 
            className="custom-cursor-trail hidden md:block"
            style={{
              transform: `translate3d(${trailPos.x}px, ${trailPos.y}px, 0) translate(-50%, -50%) scale(${isHovered ? 1.8 : 1})`,
            }}
          />
          
          {/* Fluid Ring */}
          <div 
            className={`custom-cursor-ring hidden md:block ${isHovered ? 'bg-[var(--accent-gold)]/20 border-[var(--accent-primary)] shadow-lg' : ''}`}
            style={{
              transform: `translate3d(${ringPos.x}px, ${ringPos.y}px, 0) translate(-50%, -50%) scale(${isClicking ? 0.7 : isHovered ? 1.5 : 1})`,
            }}
          />

          {/* Precision Center Dot */}
          <div 
            className={`custom-cursor-dot hidden md:block ${isHovered ? 'scale-150 bg-[var(--accent-primary)]' : ''}`}
            style={{
              transform: `translate3d(${position.x}px, ${position.y}px, 0) translate(-50%, -50%) scale(${isClicking ? 0.4 : 1})`,
            }}
          />
        </React.Fragment>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [theme, setTheme] = useState('light');
      const [scrolled, setScrolled] = useState(false);
      const [isBreathingOpen, setIsBreathingOpen] = useState(false);
      const [isBookingOpen, setIsBookingOpen] = useState(false);
      const [selectedPractice, setSelectedPractice] = useState('Personal Yoga');
      const [isThemeAnimating, setIsThemeAnimating] = useState(false);

      // Parallax mouse position
      const [mousePos, setMousePos] = useState({ x: 0, y: 0 });

      useEffect(() => {
        // Load saved theme
        const savedTheme = localStorage.getItem('energy_theme') || 
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        setTheme(savedTheme);
        document.documentElement.setAttribute('data-theme', savedTheme);

        const handleScroll = () => {
          setScrolled(window.scrollY > 40);
        };

        const handleMouseMove = (e) => {
          if (window.innerWidth > 768) {
            const x = (e.clientX - window.innerWidth / 2) / 40;
            const y = (e.clientY - window.innerHeight / 2) / 40;
            setMousePos({ x, y });
          }
        };

        window.addEventListener('scroll', handleScroll);
        window.addEventListener('mousemove', handleMouseMove);

        return () => {
          window.removeEventListener('scroll', handleScroll);
          window.removeEventListener('mousemove', handleMouseMove);
        };
      }, []);

      // Toggle Theme with Energy Core Animation
      const toggleTheme = (e) => {
        if (isThemeAnimating) return;
        setIsThemeAnimating(true);
        
        const nextTheme = theme === 'light' ? 'dark' : 'light';
        const rect = e.currentTarget.getBoundingClientRect();
        const x = rect.left + rect.width / 2;
        const y = rect.top + rect.height / 2;

        const overlay = document.createElement('div');
        overlay.className = 'theme-transition-orb';
        overlay.style.left = `${x}px`;
        overlay.style.top = `${y}px`;
        overlay.style.width = '24px';
        overlay.style.height = '24px';
        overlay.style.backgroundColor = nextTheme === 'dark' ? '#080909' : '#F8F6F0';
        overlay.style.transform = 'translate(-50%, -50%) scale(1)';
        overlay.style.opacity = '1';
        document.body.appendChild(overlay);

        requestAnimationFrame(() => {
          const maxDim = Math.max(window.innerWidth, window.innerHeight) * 3;
          overlay.style.transform = `translate(-50%, -50%) scale(${maxDim / 10})`;
        });

        setTimeout(() => {
          setTheme(nextTheme);
          document.documentElement.setAttribute('data-theme', nextTheme);
          localStorage.setItem('energy_theme', nextTheme);
        }, 350);

        setTimeout(() => {
          overlay.style.opacity = '0';
        }, 650);

        setTimeout(() => {
          overlay.remove();
          setIsThemeAnimating(false);
        }, 900);
      };

      const openBooking = (practiceName = 'Personal Yoga') => {
        setSelectedPractice(practiceName);
        setIsBookingOpen(true);
      };

      return (
        <div className="relative min-h-screen">
          {/* ANIMATED CUSTOM MOUSE CURSOR */}
          <CustomCursor />

          {/* FLOATING NAVBAR PILL */}
          <Navbar 
            scrolled={scrolled} 
            theme={theme} 
            toggleTheme={toggleTheme} 
            isThemeAnimating={isThemeAnimating}
            onOpenBooking={() => openBooking()} 
            onOpenBreath={() => setIsBreathingOpen(true)}
          />

          {/* HERO SECTION */}
          <Hero mousePos={mousePos} onOpenBooking={() => openBooking()} />

          {/* BREATHE SECTION & INTERACTIVE BREATH WIDGET trigger */}
          <BreatheSection onOpenBreath={() => setIsBreathingOpen(true)} />

          {/* ABOUT LEENA SECTION */}
          <AboutLeena />

          {/* ACHIEVEMENTS / ENERGY MILESTONES */}
          <Achievements />

          {/* SILVER MEDAL FEATURE SPOTLIGHT */}
          <SilverMedalSpotlight />

          {/* PRACTICE SECTION — CHOOSE YOUR FLOW */}
          <PracticeFlow onSelectPractice={(p) => openBooking(p)} />

          {/* CLASSES & PRICING */}
          <ClassesSection onOpenBooking={(p) => openBooking(p)} />

          {/* JOURNEY — FLOW LINE */}
          <JourneyFlow />

          {/* PHILOSOPHY FULLSCREEN */}
          <Philosophy />

          {/* TESTIMONIALS */}
          <Testimonials />

          {/* GALLERY — MOMENTS IN MOTION */}
          <Gallery />

          {/* FINAL CTA */}
          <FinalCTA onOpenBooking={() => openBooking()} />

          {/* CONTACT & FOOTER */}
          <ContactAndFooter />

          {/* INTERACTIVE BREATH MODAL */}
          {isBreathingOpen && (
            <BreathingModal onClose={() => setIsBreathingOpen(false)} />
          )}

          {/* BOOKING MODAL (5-STEP) */}
          {isBookingOpen && (
            <BookingModal 
              initialPractice={selectedPractice} 
              onClose={() => setIsBookingOpen(false)} 
            />
          )}
        </div>
      );
    }

    // --- NAVIGATION PILL ---
    function Navbar({ scrolled, theme, toggleTheme, isThemeAnimating, onOpenBooking, onOpenBreath }) {
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      const navLinks = [
        { name: 'Home', href: '#hero' },
        { name: 'About', href: '#about' },
        { name: 'Achievements', href: '#achievements' },
        { name: 'Practice', href: '#practice' },
        { name: 'Journey', href: '#journey' },
        { name: 'Gallery', href: '#gallery' },
        { name: 'Contact', href: '#contact' },
      ];

      return (
        <header className="fixed top-0 left-0 right-0 z-50 flex justify-center px-4 pt-4 transition-all duration-500">
          <nav className={`flex items-center justify-between px-6 py-3 rounded-full transition-all duration-500 max-w-7xl w-full border ${
            scrolled 
              ? 'bg-[var(--glass-bg)] backdrop-blur-xl border-[var(--border-color)] shadow-2xl scale-[0.98]' 
              : 'bg-transparent border-transparent'
          }`}>
            {/* BRAND */}
            <a href="#hero" className="flex items-center gap-2 group">

              <span className="font-display font-extrabold tracking-wider text-sm md:text-base">
                LEENA SAJJA
              </span>
            </a>

            {/* DESKTOP LINKS */}
            <div className="hidden lg:flex items-center gap-6 text-xs uppercase tracking-widest font-medium opacity-80">
              {navLinks.map((link) => (
                <a 
                  key={link.name} 
                  href={link.href}
                  className="hover:text-[var(--accent-primary)] transition-colors hover:scale-105"
                >
                  {link.name}
                </a>
              ))}
            </div>

            {/* ACTION & THEME TOGGLE */}
            <div className="flex items-center gap-3">
              <button 
                onClick={onOpenBreath}
                className="hidden sm:flex items-center gap-1.5 px-3.5 py-1.5 rounded-full border border-[var(--accent-sage)] text-xs font-medium hover:bg-[var(--accent-sage)] hover:text-white transition-all"
              >
                <span className="w-2 h-2 rounded-full bg-[var(--accent-sage)] animate-ping"></span>
                Breath
              </button>

              <button 
                onClick={onOpenBooking}
                className="px-5 py-2 rounded-full bg-gradient-to-r from-[var(--accent-primary)] to-[var(--accent-gold)] text-white text-xs font-bold tracking-wider shadow-lg hover:brightness-110 hover:shadow-amber-500/20 active:scale-95 transition-all"
              >
                BOOK
              </button>

              {}
              {/* ENERGY CORE TOGGLE BUTTON */}
              <button
                onClick={toggleTheme}
                title="Toggle Energy Core Theme"
                className={`relative w-10 h-10 rounded-full flex items-center justify-center border border-[var(--border-color)] bg-[var(--card-bg)] hover:scale-110 active:scale-95 transition-all duration-300 shadow-md ${isThemeAnimating ? 'theme-toggle-active' : ''}`}
              >
                <div className="absolute inset-0 rounded-full border border-dashed border-[var(--accent-gold)] animate-spin-slow opacity-60"></div>
                <span className="text-base font-bold text-[var(--accent-gold)] transition-transform duration-500">
                  {theme === 'light' ? '✦' : '◐'}
                </span>
              </button>

              {/* MOBILE HAMBURGER */}
              <button 
                onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                className="lg:hidden p-2 rounded-full bg-[var(--card-bg)] border border-[var(--border-color)]"
              >
                <i data-lucide={mobileMenuOpen ? "x" : "menu"} className="w-5 h-5"></i>
              </button>
            </div>
          </nav>

          {/* MOBILE NAV OVERLAY */}
          {mobileMenuOpen && (
            <div className="fixed inset-0 top-20 z-40 bg-[var(--bg-main)]/95 backdrop-blur-2xl flex flex-col items-center justify-center gap-8 text-lg font-display uppercase tracking-widest lg:hidden animate-fade-in">
              {navLinks.map((link) => (
                <a 
                  key={link.name} 
                  href={link.href}
                  onClick={() => setMobileMenuOpen(false)}
                  className="hover:text-[var(--accent-primary)] transition-colors"
                >
                  {link.name}
                </a>
              ))}
              <button 
                onClick={() => { setMobileMenuOpen(false); onOpenBreath(); }}
                className="px-6 py-2.5 rounded-full border border-[var(--accent-sage)] text-sm"
              >
                Take a Breath Widget
              </button>
            </div>
          )}
        </header>
      );
    }

    // --- HERO SECTION ---
    function Hero({ mousePos, onOpenBooking }) {
      return (
        <section id="hero" className="relative min-h-screen flex items-center justify-center pt-24 pb-12 px-6 overflow-hidden">
          {/* Animated Background Energy Orb */}
          <div 
            className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[320px] h-[320px] sm:w-[500px] sm:h-[500px] md:w-[650px] md:h-[650px] rounded-full bg-gradient-to-tr from-[var(--accent-primary)]/20 via-[var(--accent-gold)]/20 to-[var(--accent-sage)]/20 blur-3xl pointer-events-none animate-pulse-glow"
            style={{ transform: `translate(${mousePos.x * 0.3}px, ${mousePos.y * 0.3}px)` }}
          ></div>

          <div className="max-w-7xl w-full grid grid-cols-1 lg:grid-cols-12 gap-12 items-center z-10">
            {/* Left Column: Heading & Info */}
            <div 
              className="lg:col-span-7 space-y-8 text-center lg:text-left"
              style={{ transform: `translate(${mousePos.x * -0.1}px, ${mousePos.y * -0.1}px)` }}
            >
              <div className="inline-flex items-center gap-3 px-4 py-1.5 rounded-full bg-[var(--card-bg)] border border-[var(--border-color)] text-xs font-semibold uppercase tracking-widest">
                <span className="w-2 h-2 rounded-full bg-[var(--accent-gold)]"></span>
                LEENA SAJJA — PROFESSIONAL YOGA TRAINER
              </div>

              <h1 className="text-5xl sm:text-7xl md:text-8xl font-display font-extrabold tracking-tight leading-[0.95]">
                MOVE <br />
                <span className="text-transparent bg-clip-text bg-gradient-to-r from-[var(--accent-primary)] via-[var(--accent-gold)] to-[var(--accent-sage)]">
                  YOUR
                </span> <br />
                ENERGY.
              </h1>

              <p className="max-w-xl mx-auto lg:mx-0 text-base sm:text-lg opacity-80 font-light leading-relaxed">
                Strength, flexibility, balance, and mindful movement designed to awaken your body and quiet your mind through holistic flow.
              </p>

              <div className="flex flex-wrap items-center justify-center lg:justify-start gap-4 pt-2">
                <button 
                  onClick={onOpenBooking}
                  className="px-8 py-4 rounded-full bg-[var(--text-main)] text-[var(--bg-main)] font-display font-bold text-xs uppercase tracking-widest hover:scale-105 active:scale-95 transition-all shadow-xl"
                >
                  START YOUR PRACTICE
                </button>
                <a 
                  href="#about"
                  className="px-8 py-4 rounded-full border border-[var(--border-color)] bg-[var(--card-bg)] font-display font-bold text-xs uppercase tracking-widest hover:bg-[var(--bg-surface)] transition-all"
                >
                  MEET LEENA
                </a>
              </div>
            </div>

            {/* Right Column: Hero Photograph with Organic Mask & Energy Ring */}
            <div className="lg:col-span-5 relative flex items-center justify-center">
              {/* Architectural Gold Accent Frame Backdrop */}
              <div 
                className="absolute w-[295px] h-[375px] sm:w-[375px] sm:h-[475px] mask-arch-shape border-2 border-[var(--accent-gold)]/40 translate-x-3 translate-y-3 pointer-events-none"
                style={{ transform: `translate(${mousePos.x * 0.2 + 12}px, ${mousePos.y * 0.2 + 12}px)` }}
              ></div>

    // --- INTERACTIVE BREATHING MODAL ---
    function BreathingModal({ onClose }) {
      const [phase, setPhase] = useState('INHALE'); // INHALE, HOLD, EXHALE
      const [counter, setCounter] = useState(4);

      useEffect(() => {
        const timer = setInterval(() => {
          setCounter((prev) => {
            if (prev === 1) {
              if (phase === 'INHALE') { setPhase('HOLD'); return 4; }
              if (phase === 'HOLD') { setPhase('EXHALE'); return 4; }
              if (phase === 'EXHALE') { setPhase('INHALE'); return 4; }
            }
            return prev - 1;
          });
        }, 1000);

        return () => clearInterval(timer);
      }, [phase]);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-2xl p-6 animate-fade-in">
          <div className="relative max-w-md w-full bg-[var(--bg-surface)] p-10 rounded-3xl border border-[var(--border-color)] text-center shadow-2xl flex flex-col items-center">
            <button 
              onClick={onClose}
              className="absolute top-4 right-4 p-2 rounded-full border border-[var(--border-color)] hover:bg-[var(--bg-main)]"
            >
              <i data-lucide="x" className="w-5 h-5"></i>
            </button>

            <span className="text-xs uppercase tracking-widest text-[var(--accent-gold)] font-bold mb-6">
              GUIDED BREATHING
            </span>

            {/* Pulsing Orb Circle */}
            <div className="relative w-52 h-52 my-6 flex items-center justify-center">
              <div className={`absolute inset-0 rounded-full bg-gradient-to-tr from-[var(--accent-primary)] to-[var(--accent-gold)] opacity-30 transition-all duration-[1000ms] ${
                phase === 'INHALE' ? 'scale-110 shadow-2xl' : phase === 'HOLD' ? 'scale-105' : 'scale-75 opacity-20'
              }`}></div>
              <div className="w-40 h-40 rounded-full border-2 border-dashed border-[var(--accent-gold)] animate-spin-slow absolute"></div>
              
              <div className="z-10 text-center">
                <p className="text-2xl font-display font-extrabold tracking-widest">{phase}</p>
                <p className="text-4xl font-bold text-[var(--accent-primary)] mt-1">{counter}</p>
              </div>
            </div>

            <p className="text-xs opacity-75 max-w-xs mt-2">

            >

          </div>
        </div>
      );
    }

    // --- 5-STEP BOOKING MODAL ---
    function BookingModal({ initialPractice, onClose }) {
      const [step, setStep] = useState(1);
      const [sessionType, setSessionType] = useState('paid'); // 'free' or 'paid'
      const [formData, setFormData] = useState({
        practice: initialPractice || 'Personal Yoga',
        date: '2026-08-25',
        time: '',
        name: '',
        email: '',
        phone: '',
        paymentMethod: 'card'
      });
      const [isSuccess, setIsSuccess] = useState(false);
      const [isProcessingPayment, setIsProcessingPayment] = useState(false);

      // Mock slots with status: 'available', 'filled', 'unavailable'
      const timeSlots = [
        { time: '07:00 AM', status: 'available', type: 'regular', price: '$45' },
        { time: '08:30 AM', status: 'filled', type: 'regular', price: '$45' },
        { time: '10:00 AM', status: 'available', type: 'free', price: 'FREE' },
        { time: '04:00 PM', status: 'available', type: 'free', price: 'FREE' },
        { time: '05:30 PM', status: 'filled', type: 'regular', price: '$45' }
      ];

      const handleNext = () => setStep((s) => Math.min(s + 1, 5));
      const handleBack = () => setStep((s) => Math.max(s - 1, 1));

      const handleConfirm = () => {
        if (sessionType === 'paid') {
          setIsProcessingPayment(true);
          setTimeout(() => {
            setIsProcessingPayment(false);
            setIsSuccess(true);
          }, 1500);
        } else {
          setIsSuccess(true);
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-xl p-4 sm:p-6 animate-fade-in">

            <button 
              onClick={onClose}
              className="absolute top-4 right-4 p-2 rounded-full border border-[var(--border-color)] hover:bg-[var(--bg-main)]"
            >
              ✕
            </button>

            {!isSuccess ? (
              <div>
                {/* Progress Bar Header */}
                <div className="mb-5 text-center">
                  <span className="text-xs uppercase tracking-widest text-[var(--accent-gold)] font-bold">
                    STEP 0{step} OF 05 — {sessionType === 'free' ? 'FREE SESSION' : 'PAID SESSION'}
                  </span>
                  <div className="w-full h-1.5 bg-[var(--border-color)] rounded-full mt-2 overflow-hidden">
                    <div 
                      className="h-full bg-gradient-to-r from-[var(--accent-primary)] to-[var(--accent-gold)] transition-all duration-500"
                      style={{ width: `${(step / 5) * 100}%` }}

                {/* Step 1: Practice Selection */}
                {step === 1 && (
                  <div className="space-y-3">
                    <h3 className="text-lg font-display font-bold text-center">Select Your Practice Flow</h3>
                    
                    {['Personal Yoga', 'Beginner Flow', 'Flexibility Focus', 'Strength & Balance', 'Online Virtual Yoga'].map((p) => (
                      <button
                        key={p}
                        onClick={() => setFormData({ ...formData, practice: p })}
                        className={`w-full p-3 rounded-2xl border text-left font-bold text-xs sm:text-sm transition-all ${
                          formData.practice === p 
                            ? 'bg-[var(--accent-primary)] text-white border-[var(--accent-primary)] shadow-lg' 
                            : 'bg-[var(--bg-main)] border-[var(--border-color)]'
                        }`}
                      >
                        {p}
                      </button>
                    ))}
                  </div>
                )}

                {/* Step 2: Date Selection */}
                {step === 2 && (
                  <div className="space-y-4 text-center py-4">
                    <h3 className="text-lg font-display font-bold">Choose Session Date</h3>
                    <input 
                      type="date" 
                      value={formData.date}
                      onChange={(e) => setFormData({ ...formData, date: e.target.value })}

                  </div>
                )}

                {/* Step 3: Interactive Slot Selector with Color Legend */}
                {step === 3 && (
                  <div className="space-y-3">
                    <div className="text-center">

                      <div className="flex items-center gap-1.5">
                        <span className="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Available
                      </div>
                      <div className="flex items-center gap-1.5">
                        <span className="w-2.5 h-2.5 rounded-full bg-amber-500"></span> Filled Out

                      <div className="flex items-center gap-1.5">

                    </div>

                    {/* Slots List */}
                    <div className="space-y-2">
                      {timeSlots.map((slot, i) => {
                        const isSelectable = slot.status === 'available' && (sessionType === 'paid' || slot.type === 'free');
                        return (
                          <div 
                            key={i}
                            onClick={() => {
                              if (isSelectable) {
                                setFormData({ 
                                  ...formData, 
                                  time: slot.time,
                                  sessionType: slot.type === 'free' ? 'free' : 'paid'
                                });
                                setSessionType(slot.type === 'free' ? 'free' : 'paid');
                              }

                            className={`p-2.5 rounded-2xl border flex items-center justify-between transition-all ${

                                : slot.status === 'available'
                                ? 'border-[var(--border-color)] bg-[var(--bg-main)] cursor-pointer hover:border-emerald-500'
                                : slot.status === 'filled'
                                ? 'border-amber-500/40 bg-amber-500/5 opacity-75 cursor-not-allowed'
                                : 'border-rose-500/30 bg-rose-500/5 opacity-50 cursor-not-allowed'
                            }`}

                              <span className={`w-2.5 h-2.5 rounded-full ${
                                slot.status === 'available' ? 'bg-emerald-500' : slot.status === 'filled' ? 'bg-amber-500' : 'bg-rose-500'
                              }`}></span>
                              <div>
                                <p className="font-display font-bold text-xs sm:text-sm">{slot.time}</p>

                                </p>
                              </div>
                            </div>

                            <div className="text-right">
                              <span className="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-[var(--card-bg)] border border-[var(--border-color)]">
                                {slot.price}
                              </span>
                              {formData.time === slot.time && (
                                <p className="text-[9px] text-[var(--accent-gold)] font-bold mt-0.5 uppercase">Selected</p>
                              )}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* Step 4: User Details */}
                {step === 4 && (
                  <div className="space-y-3 py-2">
                    <h3 className="text-lg font-display font-bold text-center">Practitioner Details</h3>
                    <input 
                      type="text" 
                      placeholder="Full Name" 
                      value={formData.name}
                      onChange={(e) => setFormData({ ...formData, name: e.target.value })}

                    />

                    />
                    <input 
                      type="tel" 
                      placeholder="Phone Number" 
                      value={formData.phone}
                      onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                      className="w-full p-3 rounded-2xl bg-[var(--bg-main)] border border-[var(--border-color)] text-xs sm:text-sm focus:outline-none focus:border-[var(--accent-gold)]"
                    />
                  </div>

                      <p><span className="opacity-60">Flow Type:</span> <strong>{formData.practice}</strong> ({sessionType === 'free' ? 'Free Session' : 'Paid Session'})</p>
                      <p><span className="opacity-60">Date & Slot:</span> <strong>{formData.date} at {formData.time || '10:00 AM'}</strong></p>
                      <p><span className="opacity-60">Name:</span> <strong>{formData.name || 'Practitioner'}</strong></p>
                      <p><span className="opacity-60">Amount:</span> <strong className="text-[var(--accent-gold)]">{sessionType === 'free' ? 'FREE ($0)' : '$45.00'}</strong></p>
                    </div>

              </div>
            ) : (
              <div className="text-center py-6 space-y-4 animate-fade-in">
                <div className={`w-16 h-16 rounded-full text-3xl flex items-center justify-center mx-auto animate-bounce ${
                  sessionType === 'free' ? 'bg-amber-500/20 text-amber-600' : 'bg-emerald-500/20 text-emerald-600'
                }`}>
                  {sessionType === 'free' ? '⏳' : '✓'}
                </div>
                
                <h3 className="text-2xl font-display font-extrabold">
                  {sessionType === 'free' ? 'REQUEST SUBMITTED.' : 'PAYMENT SUCCESSFUL!'}
                </h3>
                
                <p className="text-xs sm:text-sm opacity-80 max-w-sm mx-auto leading-relaxed">
                  {sessionType === 'free' 
                    ? 'We will inform you when the booking is confirmed.' 
                    : 'Your booking is confirmed, ready for your slot. See you on the mat with Leena!'}
                </p>

                <button onClick={onClose} className="px-7 py-2.5 rounded-full bg-[var(--text-main)] text-[var(--bg-main)] text-xs font-bold uppercase tracking-wider hover:opacity-90">
                  CLOSE EXPERIENCE
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // Initialize Lucide Icons
    setTimeout(() => {
      if (window.lucide) {
        window.lucide.createIcons();
      }
    }, 500);
  </script>
</body>
</html>
